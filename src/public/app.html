<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Theatre4u™"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Theatre4u™</title>
<link rel="icon" href="/favicon-theatre4u.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/apple-touch-icon-theatre4u.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#181820;--card:#1c1c26;--card2:#22222e;
  --border:#2a2a38;--border2:#363648;
  --gold:#d4a843;--gold2:#f0c866;--goldd:#8a6a20;
  --red:#e05252;--green:#52c784;--blue:#5299e0;--teal:#52c7b8;
  --text:#f0ede8;--muted:#8a8aa0;--faint:#4a4a5e;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}

/* ── Scrollable content area ── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 12px)}
.screen::-webkit-scrollbar{display:none}

/* ── Bottom nav ── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bot));padding-bottom:var(--safe-bot);background:rgba(10,10,15,.95);border-top:1px solid var(--border);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-around;z-index:100}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;cursor:pointer;opacity:.45;transition:opacity .2s;-webkit-user-select:none;user-select:none;position:relative}
.bnav-item.on{opacity:1}
.bnav-item svg{width:22px;height:22px}
.bnav-item span{font-size:11px;font-weight:600;letter-spacing:.3px}
.bnav-item .badge{position:absolute;top:4px;right:8px;background:var(--red);color:#fff;border-radius:8px;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bot) + 16px);right:20px;width:58px;height:58px;background:linear-gradient(135deg,var(--gold),var(--goldd));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(212,168,67,.45);cursor:pointer;z-index:99;transition:transform .15s,box-shadow .15s;border:none}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(212,168,67,.3)}
.fab svg{width:26px;height:26px;color:#1a1000}

/* ── Page header ── */
.ph{padding:calc(var(--safe-top) + 16px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ph h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--text)}
.ph .logo{display:flex;align-items:center;gap:8px}
.ph .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--gold),var(--goldd));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ph .logo-text{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-p{padding:16px}

/* ── Search ── */
.search-wrap{padding:0 16px 12px;flex-shrink:0}
.search-input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;position:relative}
.search-input::placeholder{color:var(--faint)}
.search-input:focus{border-color:var(--gold)}
.search-wrap .si{position:relative}
.search-wrap .si svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}

/* ── Item list row ── */
.item-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;-webkit-user-select:none;user-select:none;background:var(--card)}
.item-row:active{background:var(--card2)}
.item-row:last-child{border-bottom:none}
.item-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-info{flex:1;min-width:0}
.item-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.item-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.mb-rent{background:rgba(82,153,224,.15);color:var(--blue)}
.mb-sale{background:rgba(82,199,132,.15);color:var(--green)}
.mb-loan{background:rgba(82,199,184,.15);color:var(--teal)}
.mb-none{background:rgba(255,255,255,.06);color:var(--faint)}
.mb-both{background:rgba(212,168,67,.15);color:var(--gold)}

/* ── Stat cards ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--gold);line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── Section header ── */
.sec-hd{padding:0 16px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-hd h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.sec-hd a{font-size:12px;color:var(--gold);font-weight:600}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:opacity .15s,transform .1s;-webkit-user-select:none;user-select:none}
.btn:active{opacity:.8;transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--goldd));color:#1a1000}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(224,82,82,.12);color:var(--red);border:1px solid rgba(224,82,82,.25)}
.btn-full{width:100%}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}

/* ── Modal / Sheet ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .15s ease}
.sheet{background:var(--bg2);border-radius:22px 22px 0 0;padding:0 0 calc(var(--safe-bot) + 16px);max-height:92vh;overflow-y:auto;animation:slideUp .2s cubic-bezier(.32,0,.67,0) forwards;-webkit-overflow-scrolling:touch}
.sheet::-webkit-scrollbar{display:none}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.sheet-hd{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sheet-hd h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700}
.sheet-bd{padding:16px 20px}

/* ── Full screen overlay ── */
.full-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;animation:fadeIn .15s ease}

/* ── Form ── */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.fi,.fs,.ft{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;width:100%;-webkit-appearance:none}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--gold)}
.fi::placeholder{color:var(--faint)}
.fs option{background:var(--bg2)}
.ft{resize:none;min-height:70px}

/* ── Category grid ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none}
.cat-btn.on{border-color:var(--gold);background:rgba(212,168,67,.12)}
.cat-btn:active{opacity:.7}
.cat-btn .ci{font-size:22px}
.cat-btn .cl{font-size:9px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
.cat-btn.on .cl{color:var(--gold)}

/* ── Photo area ── */
.photo-area{width:100%;aspect-ratio:4/3;background:var(--card);border-radius:14px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;overflow:hidden;position:relative;margin-bottom:14px}
.photo-area img{width:100%;height:100%;object-fit:cover}
.photo-area .pa-icon{font-size:36px;opacity:.4}
.photo-area .pa-txt{font-size:13px;color:var(--muted);font-weight:500}
.photo-area .pa-rm{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

/* ── Photo gallery ── */
.pgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pgal .pth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--card)}
.pgal .pth img{width:100%;height:100%;object-fit:cover;display:block}
.pgal .pth .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1}
.pgal .pth .cov{position:absolute;bottom:4px;left:4px;background:rgba(212,168,67,.92);color:#1a1408;font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.4px}
.pgal .padd{aspect-ratio:1;border:2px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;cursor:pointer;background:var(--card)}
.pgal .spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
.hero-swipe{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hero-swipe::-webkit-scrollbar{display:none}
.hero-swipe img{flex:0 0 100%;scroll-snap-align:center}
.hero-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2;pointer-events:none}
.hero-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero-dots span.on{background:#fff}

/* ── Camera view ── */
.cam-view{flex:1;position:relative;background:#000;overflow:hidden}
.cam-view video{width:100%;height:100%;object-fit:cover}
.cam-view canvas{position:absolute;inset:0;width:100%;height:100%}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:220px;height:220px;border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.55);position:relative}
.qr-corner{position:absolute;width:24px;height:24px;border-color:var(--gold2);border-style:solid}
.qr-corner.tl{top:-3px;left:-3px;border-width:4px 0 0 4px;border-radius:4px 0 0 0}
.qr-corner.tr{top:-3px;right:-3px;border-width:4px 4px 0 0;border-radius:0 4px 0 0}
.qr-corner.bl{bottom:-3px;left:-3px;border-width:0 0 4px 4px;border-radius:0 0 0 4px}
.qr-corner.br{bottom:-3px;right:-3px;border-width:0 4px 4px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanMove 2s ease-in-out infinite}
@keyframes scanMove{0%,100%{top:10%}50%{top:88%}}
.cam-actions{padding:20px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}

/* ── Item detail ── */
.detail-hero{width:100%;aspect-ratio:16/10;background:var(--card);position:relative;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:contain;background:#141210}
.detail-hero .hero-grad{pointer-events:none;position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,1) 0%,rgba(10,10,15,.4) 50%,transparent 100%)}
.detail-hero .hero-cat{position:absolute;top:calc(var(--safe-top) + 12px);left:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:5px}
.detail-hero .back-btn{position:absolute;top:calc(var(--safe-top) + 8px);right:16px;width:38px;height:38px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;color:var(--text);cursor:pointer}
.detail-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-row .lbl{font-size:13px;color:var(--muted)}
.detail-row .val{font-size:14px;font-weight:600;text-align:right;max-width:60%}

/* ── Auth screen ── */
.auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:32px;padding-top:calc(var(--safe-top) + 32px)}
.auth-logo{text-align:center}
.auth-logo .glyph{font-size:64px;margin-bottom:12px;display:block}
.auth-logo h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:var(--gold);letter-spacing:1px}
.auth-logo p{font-size:14px;color:var(--muted);margin-top:4px;font-style:italic}
.auth-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}

/* ── QR display ── */
.qr-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qr-box img{border-radius:8px;border:1px solid var(--border2)}

/* ── Loading / empty ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;color:var(--muted)}
.loading .spin{width:32px;height:32px;border:2.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
.empty{text-align:center;padding:50px 20px}
.empty .ei{font-size:44px;opacity:.3;margin-bottom:12px}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:22px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);line-height:1.6}

/* ── Toast ── */
.toast{position:fixed;top:calc(var(--safe-top) + 12px);left:16px;right:16px;z-index:999;background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;text-align:center;animation:fadeIn .2s ease;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:rgba(82,199,132,.4);color:var(--green)}
.toast.err{border-color:rgba(224,82,82,.4);color:var(--red)}

/* ── Condition dots ── */
.cond-grid{display:flex;gap:8px;flex-wrap:wrap}
.cond-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--muted);transition:all .12s;-webkit-user-select:none;user-select:none}
.cond-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,.1)}

/* ── Divider ── */
.div{height:1px;background:var(--border);margin:16px 0}

/* ── Offline banner ── */
.offline-bar{background:rgba(224,82,82,.15);border-bottom:1px solid rgba(224,82,82,.3);padding:8px 16px;font-size:12px;font-weight:600;color:var(--red);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Page transitions ── */
.fin{animation:fadeIn .2s ease}
</style>

         tracking runs only on the public marketing pages and /join signup page, so no
         logged-in activity (school staff / student data context) is sent to Meta. This
         keeps the Privacy Policy's "analytics on public marketing pages only" accurate. -->
</head>

<script type="module">
// Catch any module-level errors and show them visibly
window.addEventListener('error', function(e) {
  document.getElementById('root').innerHTML = 
    '<div style="padding:40px;color:#e05252;font-family:sans-serif;text-align:center">' +

      '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:8px">App failed to load</div>' +

      '<a href="'+BRAND_URL+'" style="color:#d4a843">Return to '+BRAND_HOST+'</a>' +
      '</div>';
  }
});

import { createRoot } from "https://esm.sh/react-dom@18/client";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ── Browser / OS detection ───────────────────────────────────────────────────
const ua = navigator.userAgent;
const isIOS     = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

const isIOSChrome = isIOS && isChrome;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;

  "https://ldmmphwivnnboyhlxipl.supabase.co",

);

// ── Domain-aware branding (ArtsTracker vs Theatre4u) ──────────────────────────
const IS_ARTSTRACKER = location.hostname.includes("artstracker");
const APP_NAME = IS_ARTSTRACKER ? "ArtsTracker" : "Theatre4u™";

let _qrMod = null;
async function genQR(text, size=180) {
  try {
    if (!_qrMod) _qrMod = await import("https://esm.sh/qrcode@1.5.3");
    return await _qrMod.toDataURL(text, { width:size, margin:2, color:{dark:"#000",light:"#fff"} });
  } catch { return null; }
}

// ── Image resize ──────────────────────────────────────────────────────────────
function resizeImg(file, maxW=800, q=0.82) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        let w=img.width, hh=img.height;
        if(w>maxW){hh=Math.round((maxW/w)*hh);w=maxW;}
        c.width=w; c.height=hh;
        c.getContext("2d").drawImage(img,0,0,w,hh);
        res(c.toDataURL("image/jpeg",q));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function uploadPhoto(file, userId) {
  const dataUrl = await resizeImg(file, 800, 0.82);
  const res2 = await fetch(dataUrl);
  const blob = await res2.blob();
  const path = userId + "/" + Date.now() + ".jpg";
  const { error } = await SB.storage.from("item-photos").upload(path, blob, { contentType:"image/jpeg", upsert:false });
  if (error) { console.error(error); return null; }
  const { data } = SB.storage.from("item-photos").getPublicUrl(path);
  return data.publicUrl;
}

// Live in-app camera: opens the device camera, snap a SERIES of photos without
// leaving the app, each uploaded in the background and attached to the item (up to cap).
function CameraCapture({max, current, onCapture, onClose}) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState("environment");
  const [err, setErr] = useState(false);
  const [shots, setShots] = useState([]); // {id,url,status:'up'|'ok'|'err'}
  const stopCam = () => { const s=streamRef.current; if(s){ s.getTracks().forEach(t=>t.stop()); streamRef.current=null; } };
  useEffect(() => {
    let active = true;
    (async () => {
      try {
        stopCam();
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setErr(true); return; }
        const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facing }, audio:false });
        if(!active){ s.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current = s;
        const v = videoRef.current;
        if(v){ v.srcObject = s; v.play().catch(()=>{}); }
      } catch(e){ setErr(true); }
    })();
    return () => { active=false; stopCam(); };
  }, [facing]);
  // Only count shots still uploading; finished ones are already reflected in `current`
  // (the item's attached photos), so counting both would double-count.
  const pending = shots.filter(s=>s.status==="up").length;
  const remaining = max - current - pending;
  const canSnap = remaining > 0 && !err;
  const snap = () => {
    const v = videoRef.current;
    if(!v || !v.videoWidth || remaining<=0) return;
    const cv = document.createElement("canvas");
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
    const id = String(Date.now()) + Math.random().toString(36).slice(2);
    const preview = cv.toDataURL("image/jpeg", 0.5);
    setShots(p => [...p, { id, url:preview, status:"up" }]);
    cv.toBlob(async blob => {
      if(!blob){ setShots(p=>p.map(s=>s.id===id?{...s,status:"err"}:s)); return; }
      const file = new File([blob], "camera-"+id+".jpg", { type:"image/jpeg" });
      let ok=false; try { ok = await onCapture(file); } catch(_){}
      setShots(p=>p.map(s=>s.id===id?{...s,status: ok?"ok":"err"}:s));
    }, "image/jpeg", 0.9);
  };
  const done = () => { stopCam(); onClose(); };
  const ov = {position:"fixed",inset:0,zIndex:1200,background:"#000",display:"flex",flexDirection:"column"};
  if(err) return h("div",{style:ov},
    h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#fff",padding:24,textAlign:"center",gap:12}},
      h("div",{style:{fontSize:16,fontWeight:700}},"Camera unavailable"),
      h("div",{style:{fontSize:13,opacity:.8,maxWidth:280,lineHeight:1.5}},"Allow camera access in your browser settings, or use Add Photo to pick from your library."),
      h("button",{className:"btn btn-gold",style:{marginTop:8},onClick:done},"Close")
    )
  );
  return h("div",{style:ov},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",color:"#fff"}},
      h("span",{style:{fontSize:14,fontWeight:700}}, (current+pending)+" / "+max+" photos"),
      h("button",{style:{background:"none",border:"none",color:"#fff",cursor:"pointer"},onClick:done}, Ic.x(24))
    ),
    h("div",{style:{flex:1,position:"relative",overflow:"hidden"}},
      h("video",{ref:videoRef,autoPlay:true,playsInline:true,muted:true,style:{width:"100%",height:"100%",objectFit:"cover"}}),
      remaining<=0 && h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.55)",color:"#fff",fontWeight:700,fontSize:15,textAlign:"center",padding:20}}, "All "+max+" photo slots filled — tap Done.")
    ),
    shots.length>0 && h("div",{style:{display:"flex",gap:8,padding:"10px 12px",overflowX:"auto",background:"#111"}},
      shots.map(s=>h("div",{key:s.id,style:{position:"relative",flex:"0 0 auto"}},
        h("img",{src:s.url,alt:"",style:{width:52,height:52,objectFit:"cover",borderRadius:8,opacity:s.status==="up"?.5:1,border:s.status==="err"?"2px solid #e53935":"2px solid transparent"}}),
        s.status==="up" && h("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}, h("div",{className:"spin"}))
      ))
    ),
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 24px 28px",background:"#111"}},
      h("button",{style:{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:20,padding:"10px 14px",fontSize:13,fontWeight:700,cursor:"pointer"},onClick:()=>setFacing(f=>f==="environment"?"user":"environment")},"Flip"),
      h("button",{disabled:!canSnap,"aria-label":"Take photo",onClick:snap,style:{width:72,height:72,borderRadius:"50%",border:"5px solid rgba(255,255,255,.5)",background:canSnap?"#fff":"rgba(255,255,255,.35)",cursor:canSnap?"pointer":"not-allowed"}}),
      h("button",{className:"btn btn-gold",style:{minWidth:72},onClick:done},"Done")
    )
  );
}

// Print via a hidden iframe — works in mobile Safari, Chrome, and installed PWAs where window.open is blocked.
function printHTML(html){
  const ifr=document.createElement("iframe");
  ifr.setAttribute("aria-hidden","true");
  ifr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0";
  document.body.appendChild(ifr);
  const go=()=>{ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(_){} };
  const d=ifr.contentWindow.document; d.open(); d.write(html); d.close();
  ifr.onload=()=>setTimeout(go,300);
  setTimeout(go,700);
  setTimeout(()=>{ try{ ifr.remove(); }catch(_){} },60000);
}

// Live QR scanner (progressive enhancement via BarcodeDetector). Full-screen overlay.
function MobileScanner({onCode, onClose, label}){
  const videoRef=useRef(null), streamRef=useRef(null), lastRef=useRef({code:"",at:0});
  const [err,setErr]=useState(false);
  useEffect(()=>{
    let active=true, raf=0, detector=null;
    const stop=()=>{ const s=streamRef.current; if(s){s.getTracks().forEach(t=>t.stop());streamRef.current=null;} if(raf)cancelAnimationFrame(raf); };
    (async()=>{
      try{
        if(!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setErr(true); return; }
        detector=new window.BarcodeDetector({formats:["qr_code"]});
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
        if(!active){ s.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current=s; const v=videoRef.current; if(v){ v.srcObject=s; await v.play().catch(()=>{}); }
        const tick=async()=>{
          if(!active) return;
          try{ if(v&&v.videoWidth){ const codes=await detector.detect(v); if(codes&&codes.length){ const raw=codes[0].rawValue||""; const now=Date.now(); if(raw && !(raw===lastRef.current.code && now-lastRef.current.at<1500)){ lastRef.current={code:raw,at:now}; onCode(raw); } } } }catch(_){}
          raf=requestAnimationFrame(tick);
        };
        raf=requestAnimationFrame(tick);
      }catch(_){ setErr(true); }
    })();
    return ()=>{ active=false; stop(); };
  },[onCode]);
  const ov={position:"fixed",inset:0,zIndex:1300,background:"#000",display:"flex",flexDirection:"column"};

// ── Toast ─────────────────────────────────────────────────────────────────────
function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type="ok", ms=2500) => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),ms);
  },[]);
  return [toast, show];
}
function Toast({toast}) {
  if(!toast) return null;
  return h("div",{className:`toast ${toast.type}`},toast.msg);
}

function EditSheet({item, onClose, onSaved, userId, plan}) {
  const [f, setF] = useState({...item});
  const [saving, setSaving] = useState(false);
  const [uploading, setUpl] = useState(false);
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const fileRef = useRef();

  const maxImg = maxImgFor(plan);
  const handlePhoto = async e => {
    const files = Array.from(e.target.files||[]); if(!files.length) return;
    const room = maxImg - imgsOf(f).length;
    if(room<=0){ alert(maxImg===1?"The free plan includes 1 photo per item. Upgrade to Pro for up to 5 photos.":"You can add up to "+maxImg+" photos per item."); e.target.value=""; return; }
    setUpl(true);
    for(const file of files.slice(0,room)){
      const url = await uploadPhoto(file, userId);
      if(url) setF(p=>{ const cur=imgsOf(p); if(cur.length>=maxImg) return p; const next=[...cur,url]; return {...p,images:next,img:next[0]}; });
    }
    setUpl(false);
    e.target.value="";
    if(files.length>room) alert("Added "+room+" photo"+(room!==1?"s":"")+" — this item is now at its "+maxImg+"-photo limit.");
  };
  const removeImage = idx => setF(p=>{const cur=imgsOf(p);const next=cur.filter((_,i)=>i!==idx);return {...p,images:next,img:next[0]||null};});
  const makeCover  = idx => setF(p=>{const cur=imgsOf(p);if(idx<=0||idx>=cur.length)return p;const next=[cur[idx],...cur.filter((_,i)=>i!==idx)];return {...p,images:next,img:next[0]};});

  const save = async () => {
    setSaving(true);
    const {data,error} = await SB.from("items").update(f).eq("id",f.id).select().single();
    if(!error && data) onSaved(data);
    setSaving(false);
  };

  return h("div",{className:"sheet-overlay",onClick:e=>e.target===e.currentTarget&&onClose()},
    h("div",{className:"sheet"},
      h("div",{className:"sheet-handle"}),
      h("div",{className:"sheet-hd"},
        h("h2",null,"Edit Item"),
        h("button",{style:{background:"none",border:"none",color:"var(--muted)",cursor:"pointer"},onClick:onClose},Ic.x(22))
      ),
      h("div",{className:"sheet-bd"},
        // Photos (gallery — cover first)
        h(PhotoGallery,{imgs:imgsOf(f),max:maxImg,uploading,onAdd:handlePhoto,onRemove:removeImage,onCover:makeCover,onCaptureFile:async file=>{ if(!file) return false; const url=await uploadPhoto(file,userId); if(!url) return false; setF(p=>{const cur=imgsOf(p); if(cur.length>=maxImg) return p; const next=[...cur,url]; return {...p,images:next,img:next[0]};}); return true; }}),
        h("div",{className:"fg"},h("label",{className:"fl"},"Name"),h("input",{className:"fi",value:f.name||"",onChange:e=>upd("name",e.target.value)})),
        h("div",{className:"fg"},h("label",{className:"fl"},"Location"),h("input",{className:"fi",value:f.location||"",onChange:e=>upd("location",e.target.value),placeholder:"e.g. Costume Closet A"})),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Condition"),
          h("div",{className:"cond-grid"},
            CONDS.map(c=>h("button",{key:c,className:`cond-btn${f.condition===c?" on":""}`,onClick:()=>upd("condition",c)},c))
          )
        ),
        h("div",{className:"fg"},h("label",{className:"fl"},"Availability"),h("select",{className:"fs",value:f.avail,onChange:e=>upd("avail",e.target.value)},AVAIL.map(a=>h("option",{key:a},a)))),
        h("div",{className:"fg"},h("label",{className:"fl"},"Exchange Status"),h("select",{className:"fs",value:f.mkt,onChange:e=>upd("mkt",e.target.value)},MKT.map(m=>h("option",{key:m},m)))),
        h("div",{className:"fg"},h("label",{className:"fl"},"Notes"),h("textarea",{className:"ft",value:f.notes||"",onChange:e=>upd("notes",e.target.value),rows:3})),
        h("button",{className:"btn btn-gold btn-full",onClick:save,disabled:saving||!f.name?.trim()},saving?"Saving…":"Save Changes")
      )
    )
  );
}

// Smart dropdown: shows saved locations + inline "Add New Location" form
function LocationPicker({value, onChange, userId}) {
  const [locations, setLocations] = useState([]);
  const [adding,    setAdding]    = useState(false);
  const [newName,   setNewName]   = useState("");
  const [newDesc,   setNewDesc]   = useState("");
  const [saving,    setSaving]    = useState(false);
  const [loaded,    setLoaded]    = useState(false);

  // Load saved locations for this org
  useEffect(() => {
    if(!userId) return;
    SB.from("storage_locations")
      .select("id,name,description")
      .eq("org_id", userId)
      .order("name")
      .then(({data}) => { setLocations(data||[]); setLoaded(true); });
  }, [userId]);

  const saveNew = async () => {
    if(!newName.trim()) return;
    setSaving(true);
    const {data, error} = await SB.from("storage_locations")
      .insert({org_id: userId, name: newName.trim(), description: newDesc.trim()||null})
      .select().single();
    if(!error && data) {
      setLocations(prev => [...prev, data].sort((a,b)=>a.name.localeCompare(b.name)));
      onChange(data.name);
      setNewName(""); setNewDesc("");
      setAdding(false);
    }
    setSaving(false);
  };

  return h("div",{className:"fg"},
    h("label",{className:"fl"},"Location"),
    // Dropdown of saved locations
    h("div",{style:{position:"relative"}},
      h("select",{
        className:"fs",
        value: value||"",
        onChange: e => {
          if(e.target.value === "__add__") { setAdding(true); }
          else { onChange(e.target.value); setAdding(false); }
        }
      },
        h("option",{value:""},"— Select location —"),
        locations.map(l => h("option",{key:l.id, value:l.name}, l.name)),
        h("option",{value:"__add__"},"+ Add New Location…")
      )
    ),
    // Inline add form — appears when "Add New" selected
    adding && h("div",{style:{
      marginTop:10, padding:"12px 14px",
      background:"rgba(212,168,67,.07)",
      border:"1px solid rgba(212,168,67,.25)",
      borderRadius:10
    }},
      h("div",{style:{fontSize:12,fontWeight:700,color:"rgba(212,168,67,.9)",
        textTransform:"uppercase",letterSpacing:.8,marginBottom:10}},
        "New Storage Location"
      ),
      h("input",{
        className:"fi", placeholder:"Name — e.g. Costume Closet B",
        value:newName, autoFocus:true,
        onChange:e=>setNewName(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter"){e.preventDefault();saveNew();} },
        style:{marginBottom:8}
      }),
      h("input",{
        className:"fi", placeholder:"Description (optional) — e.g. Stage left hallway",
        value:newDesc,
        onChange:e=>setNewDesc(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter"){e.preventDefault();saveNew();} },
        style:{marginBottom:10}
      }),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{
          className:"btn btn-gold", style:{flex:2},
          disabled:saving||!newName.trim(),
          onClick:saveNew
        }, saving?"Saving…":"Save Location"),
        h("button",{
          className:"btn btn-ghost", style:{flex:1},
          onClick:()=>{setAdding(false);setNewName("");setNewDesc("");}
        },"Cancel")
      )
    ),
    // Manual text fallback — shows when value typed directly or mismatched
    !adding && value && !locations.find(l=>l.name===value) && loaded && h("div",{
      style:{marginTop:6,fontSize:12,color:"rgba(212,168,67,.8)",
        display:"flex",alignItems:"center",gap:6}},
      "✏️ Custom: ",
      h("span",{style:{color:"var(--text)",fontWeight:600}},value),
      h("button",{
        onClick:()=>{
          // Save this custom value as a new location
          SB.from("storage_locations")
            .insert({org_id:userId, name:value})
            .select().single()
            .then(({data})=>{
              if(data) setLocations(prev=>[...prev,data].sort((a,b)=>a.name.localeCompare(b.name)));
            });
        },
        style:{background:"none",border:"none",color:"rgba(212,168,67,.8)",
          fontSize:11,cursor:"pointer",textDecoration:"underline",padding:0}
      },"Save this location")
    )
  );
}

    const files = Array.from(e.target.files||[]); if(!files.length) return;
    const room = maxImg - imgsOf(f).length;
    if(room<=0){ alert(maxImg===1?"The free plan includes 1 photo per item. Upgrade to Pro for up to 5 photos.":"You can add up to "+maxImg+" photos per item."); e.target.value=""; return; }
    setUpl(true);
    for(const file of files.slice(0,room)){
      const url = await uploadPhoto(file, userId);
      if(url) setF(p=>{ const cur=imgsOf(p); if(cur.length>=maxImg) return p; const next=[...cur,url]; return {...p,images:next,img:next[0]}; });
    }
    setUpl(false);
    e.target.value="";
    if(files.length>room) alert("Added "+room+" photo"+(room!==1?"s":"")+" — this item is now at its "+maxImg+"-photo limit.");
  };
  const removeImage = idx => setF(p=>{const cur=imgsOf(p);const next=cur.filter((_,i)=>i!==idx);return {...p,images:next,img:next[0]||null};});
  const makeCover  = idx => setF(p=>{const cur=imgsOf(p);if(idx<=0||idx>=cur.length)return p;const next=[cur[idx],...cur.filter((_,i)=>i!==idx)];return {...p,images:next,img:next[0]};});

  const skipPhoto = () => setStep("details");

  const save = async () => {
    if(!f.name.trim()) return;
    setSaving(true);
    const row = {...f, org_id:userId};
    const {data,error} = await SB.from("items").insert(row).select().single();
    if(!error && data) { onAdded(data); onClose(); }
    setSaving(false);
  };

  if(step==="photo") return h("div",{className:"sheet-overlay",onClick:e=>e.target===e.currentTarget&&onClose()},
    h("div",{className:"sheet"},
      h("div",{className:"sheet-handle"}),

      ),

        h("p",{style:{fontSize:14,color:"var(--muted)",marginBottom:20,lineHeight:1.6}},"Start with a photo — it takes just a few seconds and makes your inventory searchable and visual."),
        h("label",{className:"photo-area",style:{aspectRatio:"4/3",cursor:"pointer"}},
          uploading
            ? h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:10}},
                h("div",{className:"spin"}),h("span",{style:{color:"var(--muted)",fontSize:13}},"Uploading…"))
            : f.img
              ? h("img",{src:f.img,alt:""})
              : [h("div",{key:"i",className:"pa-icon"},"📷"),h("div",{key:"t",className:"pa-txt"},"Tap to take photo")],
          h("input",{ref:fileRef,type:"file",accept:"image/*",capture:"environment",hidden:true,onChange:handlePhoto})
        ),
        h("div",{style:{display:"flex",gap:10,marginTop:4}},
          h("button",{className:"btn btn-gold",style:{flex:2},onClick:()=>fileRef.current?.click()},Ic.cam(17)," Take Photo"),
          h("button",{className:"btn btn-ghost",style:{flex:1},onClick:skipPhoto},"Skip →")
        )
      )
    )
  );

  return h("div",{className:"sheet-overlay",onClick:e=>e.target===e.currentTarget&&onClose()},
    h("div",{className:"sheet"},
      h("div",{className:"sheet-handle"}),
      h("div",{className:"sheet-hd"},
        h("h2",null,"Item Details"),
        h("button",{style:{background:"none",border:"none",color:"var(--muted)",cursor:"pointer"},onClick:()=>setStep("photo")},Ic.back(22))
      ),
      h("div",{className:"sheet-bd"},
        h(PhotoGallery,{imgs:imgsOf(f),max:maxImg,uploading,onAdd:handleMorePhoto,onRemove:removeImage,onCover:makeCover,onCaptureFile:async file=>{ if(!file) return false; const url=await uploadPhoto(file,userId); if(!url) return false; setF(p=>{const cur=imgsOf(p); if(cur.length>=maxImg) return p; const next=[...cur,url]; return {...p,images:next,img:next[0]};}); return true; }}),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Item Name *"),
          h("input",{className:"fi",value:f.name,onChange:e=>upd("name",e.target.value),placeholder:"e.g. Victorian Ball Gown",autoFocus:true})
        ),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Category"),
          h("div",{className:"cat-grid"},
            CATS.map(c=>h("div",{key:c.id,className:`cat-btn${f.category===c.id?" on":""}`,onClick:()=>upd("category",c.id)},
              h("span",{className:"ci"},c.icon),

// Manage all saved storage locations from Profile tab
function StorageLocationsManager({userId}) {
  const [locations, setLocations] = useState([]);
  const [adding,    setAdding]    = useState(false);
  const [newName,   setNewName]   = useState("");
  const [newDesc,   setNewDesc]   = useState("");
  const [saving,    setSaving]    = useState(false);
  const [deleting,  setDeleting]  = useState(null);

  const load = () => {
    if(!userId) return;
    SB.from("storage_locations").select("*")
      .eq("org_id", userId).order("name")
      .then(({data}) => setLocations(data||[]));
  };
  useEffect(load, [userId]);

  const saveNew = async () => {
    if(!newName.trim()) return;
    setSaving(true);
    const {data, error} = await SB.from("storage_locations")
      .insert({org_id:userId, name:newName.trim(), description:newDesc.trim()||null})
      .select().single();
    if(!error && data) {
      setLocations(prev=>[...prev,data].sort((a,b)=>a.name.localeCompare(b.name)));
      setNewName(""); setNewDesc(""); setAdding(false);
    }
    setSaving(false);
  };

  const del = async (id) => {
    setDeleting(id);
    await SB.from("storage_locations").delete().eq("id",id);
    setLocations(prev=>prev.filter(l=>l.id!==id));
    setDeleting(null);
  };

  return h("div",{className:"card card-p",style:{marginBottom:16}},
    h("div",{style:{
      display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14
    }},
      h("div",{style:{fontSize:12,fontWeight:700,textTransform:"uppercase",
        letterSpacing:1,color:"var(--muted)"}},"Storage Locations"),
      h("button",{

    }},

      border:"1px solid rgba(212,168,67,.25)",
      borderRadius:10
    }},

        marginBottom:10,textTransform:"uppercase",letterSpacing:.8}},
        "New Storage Location"
      ),
      h("input",{
        className:"fi", placeholder:"Name — e.g. Costume Closet B",
        value:newName, autoFocus:true,
        onChange:e=>setNewName(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter"){e.preventDefault();saveNew();} },
        style:{marginBottom:8}
      }),
      h("input",{
        className:"fi", placeholder:"Description (optional)",
        value:newDesc,
        onChange:e=>setNewDesc(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter"){e.preventDefault();saveNew();} },
        style:{marginBottom:10}
      }),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{
          className:"btn btn-gold",style:{flex:2},
          disabled:saving||!newName.trim(), onClick:saveNew
        }, saving?"Saving…":"Save Location"),
        h("button",{
          className:"btn btn-ghost",style:{flex:1},
          onClick:()=>{setAdding(false);setNewName("");setNewDesc("");}
        },"Cancel")
      )
    )
  );
}

function FundingMobileTab({userId}) {
  const [sources, setSources] = useState([]);
  const [exps,    setExps]    = useState([]);
  const [loading, setLoading] = useState(true);
  const [form,    setForm]    = useState(null);
  const [saving,  setSaving]  = useState(false);
  const [toast,   showT]      = useToast();

  const FUND_TYPES = [
    {id:"grant",label:"Grant",icon:"🏛️"},
    {id:"allocation",label:"District Allocation",icon:"🏫"},
    {id:"earned",label:"Earned Income",icon:"🎟️"},
    {id:"donation",label:"Donation",icon:"🤝"},
    {id:"booster",label:"Booster/PTA",icon:"⭐"},
    {id:"other",label:"Other",icon:"📋"},
  ];

  useEffect(()=>{
    (async()=>{
      const [sr,er] = await Promise.all([
        SB.from("funding_sources").select("*").eq("org_id",userId).eq("is_active",true).order("created_at",{ascending:false}),
        SB.from("funding_expenditures").select("*").eq("org_id",userId).order("purchase_date",{ascending:false}).limit(30),
      ]);
      if(sr.data) setSources(sr.data);
      if(er.data) setExps(er.data);
      setLoading(false);
    })();
  },[userId]);

  const blankExp = ()=>({
    funding_source_id: sources.find(s=>s.is_active)?.id||"",
    description:"", amount:"", category:"", vendor:"",
    purchase_date: new Date().toISOString().slice(0,10),
  });

  const save = async()=>{
    if(!form.funding_source_id||!form.description.trim()||!form.amount) return;
    setSaving(true);
    const row={...form,org_id:userId,amount:parseFloat(form.amount)||0,purchase_date:form.purchase_date||null};
    const{data,error}=await SB.from("funding_expenditures").insert(row).select().single();
    if(!error&&data){
      setExps(p=>[data,...p]);
      setForm(null);
      showT("✓ Expenditure logged");
    } else { showT("Error: "+(error?.message||"Save failed"),"err"); }
    setSaving(false);
  };

  const totalSpent = exps.reduce((s,e)=>s+parseFloat(e.amount||0),0);
  const upd = (k,v)=>setForm(p=>({...p,[k]:v}));

  if(form!==null) return h("div",{style:{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}},
    h(Toast,{toast}),
    h("div",{style:{padding:"calc(var(--safe-top) + 12px) 16px 10px",borderBottom:"1px solid var(--border)",background:"var(--bg2)",flexShrink:0,display:"flex",alignItems:"center",gap:12}},
      h("button",{onClick:()=>setForm(null),style:{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",display:"flex",alignItems:"center"}},Ic.back(20)),
      h("h1",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:22,fontWeight:700}},"Log Expenditure")
    ),
    h("div",{className:"screen",style:{paddingBottom:100}},
      h("div",{style:{padding:"16px"}},
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Funding Source *"),
          h("select",{className:"fs",value:form.funding_source_id,onChange:e=>upd("funding_source_id",e.target.value)},
            h("option",{value:""},"Select a source…"),
            sources.map(s=>{
              const ft=FUND_TYPES.find(t=>t.id===s.source_type)||FUND_TYPES[FUND_TYPES.length-1];
              return h("option",{key:s.id,value:s.id},ft.icon+" "+s.name+(s.fiscal_year?" (FY "+s.fiscal_year+")":""));
            })
          )
        ),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Description *"),
          h("input",{className:"fi",value:form.description,onChange:e=>upd("description",e.target.value),placeholder:"What was purchased or paid for?",autoFocus:true})
        ),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
          h("div",{className:"fg"},
            h("label",{className:"fl"},"Amount ($) *"),
            h("input",{className:"fi",type:"number",min:"0",step:"0.01",value:form.amount,onChange:e=>upd("amount",e.target.value),placeholder:"0.00",inputMode:"decimal"})
          ),
          h("div",{className:"fg"},
            h("label",{className:"fl"},"Date"),
            h("input",{className:"fi",type:"date",value:form.purchase_date||"",onChange:e=>upd("purchase_date",e.target.value)})
          )
        ),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Category"),
          h("select",{className:"fs",value:form.category||"",onChange:e=>upd("category",e.target.value)},
            h("option",{value:""},"Select…"),
            ["Equipment","Instruments","Supplies","Instruction","Personnel","Travel","Production","Technology","Other"].map(c=>h("option",{key:c},c))
          )
        ),
        h("div",{className:"fg"},
          h("label",{className:"fl"},"Vendor / Payee"),
          h("input",{className:"fi",value:form.vendor||"",onChange:e=>upd("vendor",e.target.value),placeholder:"Store, company, or person"})
        )
      )
    ),
    h("div",{style:{position:"fixed",bottom:0,left:0,right:0,padding:"12px 16px",paddingBottom:"calc(var(--safe-bot) + 12px)",background:"rgba(10,10,15,.95)",borderTop:"1px solid var(--border)"}},
      h("button",{className:"btn btn-gold btn-full",onClick:save,
        disabled:saving||!form.funding_source_id||!form.description.trim()||!form.amount},
        saving?"Saving…":"Log Expenditure"
      )
    )
  );

  return h("div",{style:{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}},
    h(Toast,{toast}),
    h("div",{style:{padding:"calc(var(--safe-top) + 12px) 16px 12px",flexShrink:0}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
        h("h1",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:700}},"Funding Tracker"),
        sources.length>0&&h("button",{className:"btn btn-gold btn-sm",onClick:()=>setForm(blankExp())},Ic.plus(15)," Log Expenditure")
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:4}},
        h("div",{className:"card card-p",style:{padding:"10px 12px",textAlign:"center"}},
          h("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"var(--gold)",fontWeight:700}},"$"+totalSpent.toFixed(2)),
          h("div",{style:{fontSize:10,color:"var(--muted)",fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginTop:2}},"Total Logged")
        ),
        h("div",{className:"card card-p",style:{padding:"10px 12px",textAlign:"center"}},
          h("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:22,color:"var(--gold)",fontWeight:700}},exps.length),
          h("div",{style:{fontSize:10,color:"var(--muted)",fontWeight:700,textTransform:"uppercase",letterSpacing:.5,marginTop:2}},"Expenditures")
        )
      ),
      h("div",{style:{fontSize:11,color:"var(--muted)",marginTop:6,textAlign:"center"}},"Full reports available at "+BRAND_HOST)
    ),
    h("div",{className:"screen"},
      loading
        ? h("div",{className:"loading"},h("div",{className:"spin"}))
        : sources.length===0
          ? h("div",{className:"empty"},
              h("div",{className:"ei"},"💰"),
              h("h3",null,"No Funding Sources"),
              h("p",null,"Add funding sources on the web app first, then log expenditures here on the go."),
              h("a",{href:BRAND_URL,className:"btn btn-gold"},"Open "+BRAND_HOST)
            )
          : exps.length===0
            ? h("div",{className:"empty"},
                h("div",{className:"ei"},"🧾"),
                h("h3",null,"No Expenditures Yet"),
                h("p",null,"Tap + Log Expenditure to record your first spending entry."),
                h("button",{className:"btn btn-gold",onClick:()=>setForm(blankExp())},"+ Log First Expenditure")
              )
            : h("div",{className:"card"},
                exps.map((e,i)=>{
                  const src=sources.find(s=>s.id===e.funding_source_id);
                  return h("div",{key:e.id,className:"item-row"},
                    h("div",{style:{width:48,height:48,borderRadius:10,background:"rgba(212,168,67,.12)",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}},
                      h("span",{style:{fontSize:20}},"💰")
                    ),
                    h("div",{style:{flex:1,minWidth:0}},
                      h("div",{style:{fontWeight:700,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},e.description),
                      h("div",{style:{fontSize:12,color:"var(--muted)",marginTop:2}},
                        src?src.name:"Unknown source",
                        e.category?" · "+e.category:"",
                        e.purchase_date?" · "+new Date(e.purchase_date+"T00:00:00").toLocaleDateString():""
                      )
                    ),
                    h("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:700,color:"var(--gold)",flexShrink:0}},
                      "$"+parseFloat(e.amount).toFixed(2)
                    )
                  );
                })
              )
    )
  );
}


function App() {
  const [user, setUser]       = useState(null);
  const [org, setOrg]         = useState(null);
  const [items, setItems]     = useState([]);
  const [tab, setTab]         = useState("home");
  const [loading, setLoading] = useState(true);
  const [authChk, setAuthChk] = useState(false);
  const [pointBalance, setPointBalance] = useState(0);
  const [viewItem, setViewItem] = useState(null);
  const [addOpen, setAddOpen]   = useState(false);
  const [online, setOnline]     = useState(navigator.onLine);
  const [toast, showT]          = useToast();

  // Online/offline detection
  useEffect(()=>{
    const on=()=>setOnline(true); const off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off);};
  },[]);

  // Auth
  useEffect(()=>{
    SB.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null); setAuthChk(true);
    });
    const{data:{subscription}}=SB.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user||null);
      if(!session){setItems([]);setOrg(null);setLoading(true);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  // Load data
  useEffect(()=>{
    if(!user) return;
    (async()=>{
      setLoading(true);
      // Check if user is a team member of another org
      const{data:memberData}=await SB.from("org_members")
        .select("org_id,role")
        .eq("user_id",user.id)
        .single();
      const targetOrgId = memberData ? memberData.org_id : user.id;
      const memberRole  = memberData ? memberData.role   : null;
      const{data:orgData}=await SB.from("orgs").select("*").eq("id",targetOrgId).single();
      if(orgData){ setOrg({...orgData, _memberRole:memberRole}); CATS = VCATS[orgData.vertical] || VCATS.theatre; }
      const{data:itemData}=await SB.from("items").select("*").eq("org_id",targetOrgId).order("added",{ascending:false}).limit(300);
      if(itemData) setItems(itemData);
      // Load Stage Points balance
      SB.rpc("get_my_credit_balance").then(({data})=>{ if(data!=null) setPointBalance(data||0); }).catch(()=>{});
      setLoading(false);
    })();
  },[user]);

  const handleItemAdded = useCallback(item=>{
    setItems(p=>[item,...p]);
    showT("✓ Item added to inventory");
  },[]);

  const handleItemEdited = useCallback(updated=>{
    setItems(p=>p.map(i=>i.id===updated.id?updated:i));
    if(viewItem?.id===updated.id) setViewItem(updated);
    showT("✓ Saved");
  },[viewItem]);

  const handleItemDeleted = useCallback(id=>{
    setItems(p=>p.filter(i=>i.id!==id));
    setViewItem(null);
    showT("Item deleted","ok");
  },[]);

  const handleViewItem = useCallback(item=>{
    setViewItem(item); setTab("home");
  },[]);

  // Keep the inventory list live when Rentals flips an item's availability.
  const handleItemSync = useCallback((id,avail)=>{
    setItems(p=>p.map(i=>i.id===id?{...i,avail}:i));
  },[]);

  const signOut = async()=>{await SB.auth.signOut();setUser(null);};

  if(!authChk) return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}},
    h("div",{style:{fontSize:52}},"🎭"),
    h("div",{style:{width:32,height:32,border:"2.5px solid var(--border2)",borderTopColor:"var(--gold)",borderRadius:"50%",animation:"spin .7s linear infinite"}})
  );

  if(!user) return h(AuthScreen,{onAuth:setUser});

  if(loading) return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16}},
    h("div",{style:{fontSize:52}},"🎭"),
    h("div",{className:"loading"},h("div",{className:"spin"}),h("span",{style:{color:"var(--muted)",fontSize:14}},"Loading inventory…"))
  );

  // Plan gate — free users see upgrade screen
  const isPro = org?.plan === "pro" || org?.plan === "district" || org?.temp_pro === true || org?.email === "theatre4u1@gmail.com";
  if(!isPro) return h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",padding:32,textAlign:"center",gap:20}},
    h("div",{style:{fontSize:64}},"📱"),
    h("div",{style:{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:700,color:"#d4a843"}},"Pro Feature"),
    h("p",{style:{fontSize:15,color:"var(--muted)",lineHeight:1.7,maxWidth:320}},
      "The "+APP_NAME+" mobile app is included with Pro and District plans. Upgrade at "+(IS_ARTSTRACKER?"artstracker.org":"theatre4u.org")+" to unlock mobile inventory management, Funding Tracker, and QR scanning."
    ),
    h("a",{href:BRAND_URL,style:{background:"linear-gradient(135deg,#d4a843,#8a6a20)",color:"#1a1000",padding:"14px 32px",borderRadius:10,fontWeight:700,fontSize:16,textDecoration:"none"}},"Upgrade at "+BRAND_HOST+" →"),
    h("button",{onClick:signOut,style:{background:"none",border:"none",color:"var(--muted)",fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",marginTop:8}},"Sign out")
  );

  const navItems = [
    {id:"home",    label:"Home",       icon:Ic.home},
    {id:"inventory",label:"Items",     icon:Ic.box},
    ...(isPro ? [{id:"funding", label:"Funding", icon:(s=24)=>h("span",{style:{fontSize:s*0.92,lineHeight:1}},"💰")}] : []),
    ...(isPro ? [{id:"points",  label:pointBalance>0?pointBalance+"pts":"Points",
                  icon:(s=24)=>h("span",{style:{fontSize:s*0.92,lineHeight:1}},"🪙")}] : []),
    {id:"profile", label:"Profile",    icon:Ic.user},
  ];

  return h("div",{id:"app",style:{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}},
    Toast&&h(Toast,{toast}),
    !online && h("div",{className:"offline-bar"},"⚡ Offline — some features may be unavailable"),
    // View item detail (full screen)
    viewItem && h(ItemDetail,{item:viewItem,onBack:()=>setViewItem(null),onEdited:handleItemEdited,onDeleted:handleItemDeleted,userId:org?.id||user.id,plan:org?.plan||"free"}),
    // Tab content
    !viewItem && h("div",{style:{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}},
      !isStandalone && h(InstallBanner,null),
      tab==="home"      && h(HomeTab,{items,org,pointBalance,onAddItem:()=>setAddOpen(true),onViewItem:handleViewItem}),
      tab==="inventory" && h(InventoryTab,{items,onViewItem:handleViewItem,onAddItem:()=>setAddOpen(true),userId:org?.id||user.id,org,flash:showT,onItemSync:handleItemSync}),
      tab==="funding"   && h(FundingMobileTab,{userId:org?.id||user.id}),
      tab==="points"    && h(PointsTab,{userId:user?.id,pointBalance,setPointBalance}),
      tab==="profile"   && h(ProfileTab,{user,org,onSignOut:signOut})
    ),
    // Bottom nav
    !viewItem && h("div",{className:"bnav"},
      navItems.map(n=>h("div",{key:n.id,className:`bnav-item${tab===n.id?" on":""}`,onClick:()=>setTab(n.id)},
        n.icon(22),
        h("span",null,n.label)
      ))
    ),
    // FAB — only on home and inventory
    !viewItem && (tab==="home"||tab==="inventory") && org?._memberRole !== "house" && h("button",{className:"fab",onClick:()=>setAddOpen(true)},Ic.plus(26)),
    // Add sheet
    addOpen && h(AddSheet,{onClose:()=>setAddOpen(false),onAdded:handleItemAdded,userId:org?.id||user.id,plan:org?.plan||"free"})
  );
}

createRoot(document.getElementById("root")).render(h(App,null));
</script>
