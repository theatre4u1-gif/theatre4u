<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theatre4u</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #snd{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
    background:#E9B44C;color:#1a0f00;font:700 18px -apple-system,Arial,sans-serif;
    border:none;border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
</style></head>
<body>
  <video id="v" src="/booth.mp4" autoplay loop muted playsinline></video>
  <button id="snd">🔊 Tap for sound</button>
  <script>
    var v=document.getElementById('v'), b=document.getElementById('snd');
    function sound(){ try{ v.muted=false; v.play(); }catch(e){} b.style.display='none'; }
    b.addEventListener('click', sound);
    document.body.addEventListener('click', function(e){ if(e.target!==b) sound(); });
    // keep it playing/looping even if the browser pauses on load
    v.addEventListener('ended', function(){ v.currentTime=0; v.play(); });
    setInterval(function(){ if(v.paused){ v.play().catch(function(){}); } }, 4000);
    v.play().catch(function(){});
  </script>
</body></html>
